<!doctype html><html lang="tr"><head>
<!-- Level chart card (playbook §3.5 item 6, built 2026-11-07). 1200×675, light, same tokens and navy
     bottom bar as commentator v3.1. Shown ~295 px wide in the phone feed: headline 44 px, level labels
     36 px, attribution 34 px, axis/legend 30 px. Filled by make_level_chart.py, which replaces the
     markup between the card:start / card:end markers with the site's price series and the speaker's
     named levels. SAMPLE below: Selçuk Geçer, altın, video 830 (6 Nov 2026), levels 5.000 $ and 5.600 $,
     1-year weekly XAU/USD series fetched 2026-11-07. No arrows, no direction colour: the dashed navy
     lines are the speaker's levels, the dark line is the site's price series. --><meta charset="utf-8"><style>
:root{--bg:#FAFAF7;--text:#16181B;--muted:#555A62;--accent:#1F3A8A;--border:#E3E1DA;--line:#2B2F36}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:675px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;padding:34px 64px 18px}
h1{font-family:Charter,"Iowan Old Style",Georgia,serif;font-weight:600;font-size:44px;line-height:1.16;letter-spacing:-.01em;text-wrap:balance}
h1.long{font-size:38px;line-height:1.14}
.who{margin-top:10px;font-size:34px;color:var(--muted)}
.who b{color:var(--text);font-weight:700}
.chart{margin-top:14px;flex:1;display:flex;align-items:center}
.chart svg{display:block;width:1072px;height:316px}
.y{font-size:30px;fill:var(--muted);font-variant-numeric:tabular-nums}
.x{font-size:30px;fill:var(--muted)}
.grid{stroke:var(--border);stroke-width:2}
.series{fill:none;stroke:var(--line);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.level{stroke:var(--accent);stroke-width:4;stroke-dasharray:14 12}
.pill{fill:var(--accent)}
.leader{stroke:var(--accent);stroke-width:2}.leader.last{stroke:var(--line)}
.pill-t{font-size:36px;font-weight:700;fill:#fff;font-variant-numeric:tabular-nums}
.last-dot{fill:var(--line)}
.last-t{font-size:34px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
.legend{margin-top:4px;display:flex;flex-direction:column;gap:2px;font-size:30px;line-height:1.2;color:var(--muted);white-space:nowrap}
.legend i{display:inline-block;width:40px;height:0;border-top:4px solid var(--line);vertical-align:middle;margin-right:10px}
.legend i.l{border-top:4px dashed var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;padding:20px 64px;font-size:38px;font-weight:600}
.bar span{opacity:.9;font-weight:500}
</style></head><body>
<div class="main">
