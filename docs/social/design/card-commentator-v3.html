<!doctype html><html lang="tr"><head>
<!-- Commentator card v3.1, mobile-first (owner decision 2026-10-27). Example data: Erkan Öz, 26 Oct.
     Shown ~295 px wide in the phone feed (~25 %): keep every text >= 34 px at 1200 px, direction >= 88 px.
     Photo: channel_avatar_url saved as avatar.jpg next to this file (sips -Z 300); never commit it.
     Multi-guest/logo channel: replace <img> with <div class="ini">EÖ</div>.
     New view (no change): drop the .was line. Flat: class "dir flat" with → Yatay. Up: class "dir up" with ↑ Yükseliş. --><meta charset="utf-8"><style>
:root{--bg:#FAFAF7;--text:#16181B;--muted:#555A62;--accent:#1F3A8A;--bull:#15703D;--bear:#B83227;--bear-bg:#FBE6E2;--border:#E3E1DA}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:675px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;display:flex;flex-direction:column}
.main{flex:1;display:grid;grid-template-columns:380px 1fr;gap:56px;align-items:center;padding:44px 64px 24px}
.who{text-align:center}
.who img{width:280px;height:280px;border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--border)}
.who .n{margin-top:22px;font-size:58px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.who .s{margin-top:6px;font-size:34px;color:var(--muted)}
.was{white-space:nowrap}
.topic{font-size:46px;font-weight:800;letter-spacing:.04em;color:var(--accent)}
.dir{display:inline-block;margin-top:18px;font-size:92px;font-weight:900;letter-spacing:-.02em;color:var(--bear);background:var(--bear-bg);padding:6px 34px 12px;border-radius:28px;line-height:1.05}
.dir small{display:block;font-size:44px;font-weight:700;letter-spacing:0}
.was{margin-top:26px;font-size:46px;font-weight:600;color:var(--muted)}
.was b{color:var(--bull)}
.ini{width:280px;height:280px;margin:0 auto;border-radius:50%;background:rgba(31,58,138,.1);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:800}
.dir.up{color:var(--bull);background:#E4F4EA}.dir.flat{color:#4B5563;background:#ECEDEE}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;padding:20px 64px;font-size:38px;font-weight:600}
.bar span{opacity:.9;font-weight:500}
</style></head><body>
<div class="main">
 <div class="who"><img src="avatar.jpg" alt=""><div class="n">Erkan Öz</div><div class="s">YouTube kanalı</div></div>
 <section>
  <div class="topic">ABD BORSALARI</div>
  <div class="dir">↓ Düşüş<small>bekliyor · 25 Eki</small></div>
  <div class="was">Önceki: <b>↑ Yükseliş</b> · 20 Eki</div>
 </section>
</div>
<div class="bar"><b>dovizveri.com</b><span>Yatırım tavsiyesi değildir.</span></div>
</body></html>
