<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  /* Avatar B: three direction arrows (up / flat / down) in a navy ring on paper. No text. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 400px; height: 400px; }
  body { background: #FAFAF7; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="158" fill="none" stroke="#1F3A8A" stroke-width="14"/>
    <g fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <!-- up: bull -->
      <path d="M120 256 V146 M96 170 L120 144 L144 170" stroke="#15703D"/>
      <!-- flat: neutral -->
      <path d="M174 200 H224 M204 178 L226 200 L204 222" stroke="#4B5563"/>
      <!-- down: bear -->
      <path d="M280 144 V254 M256 230 L280 256 L304 230" stroke="#B83227"/>
    </g>
  </svg>
</body>
</html>
