<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  /* Avatar A: "DV" serif monogram on the accent. Content stays inside the 340 px centre circle. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 400px; height: 400px; }
  body { background: #1F3A8A; display: flex; align-items: center; justify-content: center; }
  .mark { position: relative; width: 340px; height: 340px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; }
  .dv { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 168px;
        line-height: 1; letter-spacing: -.02em; color: #FAFAF7; margin-top: -6px; }
  .rule { width: 132px; height: 6px; border-radius: 3px; background: #FAFAF7; opacity: .9; margin-top: 18px; }
</style>
</head>
<body>
  <div class="mark"><div class="dv">DV</div><div class="rule"></div></div>
</body>
</html>
